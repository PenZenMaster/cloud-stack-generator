# Pre-commit configuration for Cloud Stack Generator
# This ensures code quality and prevents regressions before commits
#
# Version: 1.0.0
# Date: 2025-08-14

repos:
  # Code formatting and style
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=88]
        
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]
        
  # Code linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: [--max-line-length=88, --extend-ignore=E203,W503]
        
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: debug-statements
      
  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: [-r, src/, -f, json, -o, security-report.json]
        
  # Core functionality tests
  - repo: local
    hooks:
      - id: pytest-cities
        name: Run Cities Tab Tests
        entry: python -m pytest tests/unit/test_cities_tab.py tests/integration/test_cities_yaml_bug.py -v
        language: system
        files: ^(src/.*cities.*\.py|src/core/config/.*\.py|tests/.*cities.*\.py)$
        pass_filenames: false
        
      - id: pytest-core
        name: Run Core Model Tests  
        entry: python -m pytest tests/unit/test_config_parser.py tests/test_config_parser.py -v
        language: system
        files: ^(src/core/config/.*\.py|src/core/data/.*\.py)$
        pass_filenames: false
        
      - id: pytest-validation
        name: Run ValidationResult Tests
        entry: python -c "import sys; sys.path.insert(0, 'src'); from ui.components.base_tab import ValidationResult; r = ValidationResult(); r.add_error('test', 'field'); print('ValidationResult OK'); list(r.field_errors.items())"
        language: system
        files: ^src/ui/components/.*\.py$
        pass_filenames: false