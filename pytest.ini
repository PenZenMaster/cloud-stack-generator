[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --verbose
markers =
    unit: Unit tests
    integration: Integration tests
    ui: UI tests requiring PyQt6
    aws: Tests requiring AWS credentials
    slow: Slow running tests
    cities: Tests for Cities tab functionality
    yaml_bug: Tests related to YAML bug fixes
    phase1_fixes: Tests for Phase 1 Cities improvements
    cloud: Tests for cloud infrastructure components

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning