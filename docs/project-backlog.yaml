- id: BACK-007
  title: Implement CLI deploy command (S3 + CloudFront)
  description: >
    The `awg deploy` CLI command is currently a stub that prints a placeholder message.
    Implement full S3 sync and CloudFront cache invalidation so deployments can be
    triggered from the CLI without manual AWS CLI commands.

    Observed behavior (2026-02-17): Running `python -m src.cli deploy -c <config> -p aws_s3`
    prints "Deployment functionality will be available in Phase 1" and exits without
    uploading anything. User must manually run `aws s3 sync` and
    `aws cloudfront create-invalidation` after each generation.

    Implementation scope:
    - Read aws_profile, bucket_name, deployment_url, distribution_id, auto_invalidate_cache
      from ClientConfig.cloud
    - Use boto3 (already a dependency) to sync output directory to S3 bucket with
      correct content-type headers and public-read ACL (or bucket policy)
    - Delete S3 objects not present in local output (equivalent to --delete flag)
    - If auto_invalidate_cache is true and distribution_id is set, create a CloudFront
      invalidation for /* after upload completes
    - Support --dry-run flag (already wired in CLI) - print files that would be
      uploaded/deleted without actually doing it
    - Print upload progress and final deployed URL on success
    - Support all four registered providers: aws_s3, google_gcs, wasabi, backblaze_b2
      (aws_s3 is the priority; others can remain stubs for now)
  type: feature
  priority: high
  status: todo
  labels:
  - deploy
  - aws
  - s3
  - cloudfront
  - cli
  story_points: 5
  acceptance_criteria:
  - '`awg deploy -c <config> -p aws_s3` uploads all files in output dir to correct S3 bucket'
  - 'Correct Content-Type headers set per file extension (text/html, text/css, image/png, etc.)'
  - 'Files removed from output dir are deleted from S3 (--delete behavior)'
  - 'CloudFront invalidation triggered automatically when auto_invalidate_cache: true'
  - '--dry-run prints planned actions without uploading'
  - 'Final deployed URL printed on success'
  - 'aws_profile from config used for boto3 session (not default profile)'
  created_date: '2026-02-17'
  assigned_to: ''
  epic: Deployment Automation
  dependencies: []
  notes: 'Discovered during Florida site deployment session. User currently running
    aws s3 sync and cloudfront create-invalidation manually after every generate run.
    Implementing this would complete the generate -> deploy workflow end-to-end.'
