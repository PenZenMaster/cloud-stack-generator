  - about_city: Bellwood is a village in Proviso Township, Cook County, Illinois,
      United States. Located 13 miles (21 km) west of Chicago's downtown Loop, the
      Village of Bellwood is bounded by the Eisenhower Expressway (south), the Proviso
      yards of the former Chicago & Northwestern, now Union Pacific Railroad (north),
      and the suburbs of Maywood (east) and Hillside and Berkeley (west). The population
      was 18,789 at the 2020 census.
