        craftsmanship with jobsite pragmatism—think custom cupolas, dormers, finials,
        leader boxes, roof vents, and snow guards engineered to live gracefully on
        real roofs in real weather.


        What sets Salvo apart isn’t just copper, zinc, or powder-coated steel; it’s
        process. You’ll get clean shop drawings, clear tolerances, and submittals
        that actually answer questions. Need a quick RFI turnaround, a field template,
        or a tweak for tricky substrate transitions? Done. Salvo builds for performance
        first—proper drainage paths, smart attachment systems, and expansion allowances—then
        finishes with the kind of patina and proportion that makes elevations sing.'
