  industry: Metal Fabrication
  mission_statement: Salvo Metal Works exists to forge function with metal mastery—designing
    and crafting bespoke architectural metal that elevates beauty, improves performance,
    and lasts for generations. We partner with architects, builders, and discerning
    homeowners to deliver precision-engineered cupolas, finials, dormers, roof vents,
    chimney shrouds, leader boxes, and snow guards that blend old-world craftsmanship
    with modern fabrication. Our mission is to protect and enhance the built environment
    through meticulous design, premium materials, and relentless attention to detail—delivered
    on time, to spec, and built to outlast the roof beneath it.
  offerings:
  - category: '1000'
    description: Cupolas are elegant roof features that add style and utility. Set
      at the roof’s peak, they introduce a timeless accent and can be square, round,
      or octagonal. We build them in copper, lead-coated or freedom gray copper, zinc,
      or aluminum that patina beautifully. Cupolas vent hot air to reduce moisture,
      and many include windows or louvers. Custom sizing and detailing let them fit
      rustic or modern homes while bringing light, airflow, and a refined focal point.
    image_url: https://salvometalworks.com/wp-content/uploads/2024/11/custom-copper-cupola-300x300.jpg
    name: Custom Copper Cupolas
    price: ''
    sku: SMW-CUPOLAS
    type: product
  - category: '3000'
    description: Elevate your architecture with Salvo Metal Works’ finials—beauty
      meeting function. Designed for turrets, ridgelines, towers, and gables, they
      come in many shapes and sizes to suit any style. First used to curb water seepage
      on round roofs, finials evolved into striking accents across Gothic, Renaissance,
      and modern designs, giving rooflines a polished, memorable finish.
    image_url: https://salvometalworks.com/wp-content/uploads/2024/11/custom-copper-finial-309.jpg
    name: Custom Copper Finials
    price: ''
    sku: SMW-FINIALS
    type: product
  - category: '4000'
    description: Dormers rise from a sloped roof to add space, light, and ventilation,
      typically housing a window or vent. Clad in copper or other durable metals,
      they increase usable area on upper levels while brightening attics or top-floor
      rooms. Copper dormers stand out for long life, low maintenance, and a rich patina
      that deepens over time, pairing practical benefits with distinctive curb appeal.
    image_url: https://salvometalworks.com/wp-content/uploads/2024/11/custom-copper-dormer.png
    name: Custom Copper Dormer
    price: ''
    sku: SMW-DORMERS
    type: product
  - category: '5000'
    description: Roof vents manage airflow by bringing in cool air and exhausting
      warm, moist air. Intakes are commonly placed in the soffit or near the eave;
      exhaust vents sit high on the roof, often integrated along the ridge. Available
      in multiple shapes and sizes, a balanced system improves energy efficiency,
      extends roof life, and helps prevent condensation, ice dams, and heat buildup.
    image_url: https://salvometalworks.com/wp-content/uploads/2025/04/Roof-vent.png
    name: Custom Copper Roof Vents
    price: ''
    sku: SMW-ROOF-VENTS
    type: product
  - category: '6000'
    description: Chimney Shrouds, also called chimney caps, chimney pots, chimney
      covers, can be used as a decorative or functional top for a chimney. Not only
      do these caps serve the purpose of protecting the top of a chimney, it also
      can add a beautiful aesthetic to a home’s roof line. All Salvo Metal Works chimney
      shrouds are made to order by our in-house fabricators. Expertly crafted from
      high-quality materials.
    image_url: https://salvometalworks.com/wp-content/uploads/2024/11/custom-copper-chimney-shrouds.webp
    name: Custom Chimney Shrouds
    price: ''
    sku: SMW-CHIMNEY-SHROUDS
    type: product
  - category: '2000'
    description: Chimney shrouds—also called caps, pots, or covers—protect the flue
      and elevate curb appeal. Made to order by Salvo Metal Works, each is crafted
      from high-quality materials to block debris, shed water, and improve draft.
      Choose from tailored designs and finishes that match your architecture. Our
      custom fabrication delivers lasting durability and refined style for any home.
    image_url: https://salvometalworks.com/wp-content/uploads/2025/04/custom-copper-leaderbox.jpg
    name: Custom Copper Leader Box
    price: ''
    sku: SMW-LEADER-BOXES
    type: product
  - category: '1500'
    description: Custom Copper Snow Guards stop dangerous roof-snow slides, protecting
      people, gutters, and landscaping. Crafted from premium copper, they resist corrosion,
      develop a rich patina, and suit slate or metal roofs. Each system is custom-sized
      and spaced to your roof for dependable retention, long life, and refined curb
      appeal.
    image_url: https://salvometalworks.com/wp-content/uploads/2024/12/snow-guard-6.jpeg
